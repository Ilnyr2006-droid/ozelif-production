server {
    listen 127.0.0.1:8091;
    listen [::1]:8091;
    server_name _;
    server_tokens off;
    include /etc/nginx/snippets/ozelif-security-headers.conf;

    root /var/www/ozelif-8091;
    index index.html;

    # Canonical public host and HTTPS. The local 8091 smoke path is unaffected
    # unless the reverse proxy explicitly forwards a non-canonical public host
    # or an http scheme.
    if ($host = www.ozelifkoja.ru) {
        return 301 https://ozelifkoja.ru$request_uri;
    }

    if ($http_x_forwarded_proto = http) {
        return 301 https://ozelifkoja.ru$request_uri;
    }

    # The admin interface is available through an SSH tunnel only.
    location ^~ /admin {

        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        include /etc/nginx/snippets/ozelif-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    location = /api/admin/login {
        limit_req zone=ozelif_admin_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8093;
        include proxy_params;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/admin/ {
        proxy_pass http://127.0.0.1:8093;
        include proxy_params;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/analytics/events {
        limit_req zone=ozelif_analytics burst=120 nodelay;
        proxy_pass http://127.0.0.1:8093;
        include proxy_params;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8093;
        include proxy_params;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        client_max_body_size 15m;
        proxy_pass http://127.0.0.1:8093;
        include proxy_params;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/ozelif-security-headers.conf;
    }

    # Published categories and products are read from PostgreSQL, so sitemap
    # discovery stays current without rebuilding the frontend.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8093;
        include proxy_params;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Preserve the indexed legacy delivery URL and its search equity.
    location = /info {
        return 301 https://ozelifkoja.ru/delivery;
    }

    location = /info/ {
        return 301 https://ozelifkoja.ru/delivery;
    }

    # Legacy Tilda URLs which are still present in search results.
    location = /product-page/maroco-black-259 {
        return 301 https://ozelifkoja.ru/odejnayakozha/tproduct/498208614312-marocco-black;
    }

    location ^~ /product-page/ {
        return 301 https://ozelifkoja.ru/odejnayakozha;
    }

    location ^~ /coat-page/ {
        return 301 https://ozelifkoja.ru/dublyonka;
    }

    location = /odejnayakozha/gladkaya/ {
        return 301 https://ozelifkoja.ru/odejnayakozha;
    }

    location = /odejnayakozha/vintazhnaya {
        return 301 https://ozelifkoja.ru/odejnayakozha;
    }

    location = /odejnayakozha/fakturnaya {
        return 301 https://ozelifkoja.ru/odejnayakozha;
    }

    # Public pages use one canonical form without a trailing slash. Prefix
    # locations marked ^~ above (admin, api, uploads, legacy paths) keep their
    # dedicated behavior and are not captured by this redirect.
    location ~ ^/(.+)/$ {
        return 301 https://ozelifkoja.ru/$1$is_args$args;
    }

    # SEO subcategories are rendered dynamically from the published PostgreSQL
    # catalog so the initial HTML always contains the current product links and
    # can become noindex automatically if the group becomes empty.
    location ~ ^/(?:dublyonka/(?:kerli|toskana)|odejnayakozha/(?:perforirovannaya|krs))$ {
        proxy_pass http://127.0.0.1:8093;
        include proxy_params;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dynamic SEO prerender for every slug-shaped product detail URL. The
    # backend verifies that both the category and product are published in
    # PostgreSQL, so a new published category needs no Nginx or frontend edit.
    location ~ ^/[a-z0-9-]+/tproduct/[^/]+/?$ {
        proxy_pass http://127.0.0.1:8093;
        include proxy_params;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Current catalog pages are rendered from the same PostgreSQL payload as
    # the public API. New category slugs still use @dynamic_category below.
    location ~ ^/(?:odejnayakozha|dublyonka|zamsha|obuvnayakozha|galantereynayakozha|furnitura)/?$ {
        proxy_pass http://127.0.0.1:8093;
        include proxy_params;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        include /etc/nginx/snippets/ozelif-security-headers.conf;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        include /etc/nginx/snippets/ozelif-security-headers.conf;
        try_files /index.html =404;
    }

    location = / {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        include /etc/nginx/snippets/ozelif-security-headers.conf;
        try_files /index.html =404;
    }

    location / {
        # Prefer a prerendered route page before treating the route as a
        # directory, so /contacts and /contacts/ share one canonical URL.
        try_files $uri/index.html $uri $uri/ @dynamic_category;
    }

    location @dynamic_category {
        proxy_pass http://127.0.0.1:8093;
        include proxy_params;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|ico|webp|avif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/ozelif-security-headers.conf;
    }
}
