
services:
  postgres:
    image: postgres:16-alpine
    container_name: ozelif-admin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ozelif}
      POSTGRES_USER: ${POSTGRES_USER:-ozelif}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - ozelif_admin_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ozelif} -d ${POSTGRES_DB:-ozelif}"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  ozelif_admin_postgres:
