# OZELIF live Commercial SEO cluster routes.
# Exact matches intentionally outrank the static SPA try_files handler.
# Cache bypass + diagnostic header make routing verifiable from production.

location = /odejnayakozha/krs {
    proxy_pass http://127.0.0.1:8093;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Ozelif-SEO-Cluster "express-live" always;
}
