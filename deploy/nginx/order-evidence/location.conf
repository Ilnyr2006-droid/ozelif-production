# Include inside the public OZELIF server, before the general /api/ location.
# This prefix also covers a trailing slash and normalized URI variants.
location ^~ /api/internal/direct/ {
    limit_req zone=ozelif_evidence_ip burst=5 nodelay;
    limit_req zone=ozelif_evidence_total burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8093;
    include proxy_params;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
